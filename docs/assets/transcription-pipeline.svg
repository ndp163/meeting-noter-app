<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="Animated diagram of the Meeting Noter transcription pipeline: dual-source capture, resample, voice activity detection, segmenter, ASR, and live transcript.">
  <!-- Meeting Noter — Vintage/Sepia palette mirrored from src/design-system/tokens.css -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5552f"/>
      <stop offset="1" stop-color="#d08a4f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3a3128" flood-opacity="0.10"/>
    </filter>
    <style>
      .card  { fill:#fbf6ec; stroke:#e3d8c6; stroke-width:1.5; }
      .title { fill:#3a3128; font-weight:700; }
      .lbl   { fill:#3a3128; font-weight:600; font-size:15px; }
      .meta  { fill:#9b8e78; font-size:12px; }
      .ink   { fill:#6b5f4f; font-size:13px; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1180" height="460" fill="#f4ece0"/>

  <text x="40" y="52" class="title" font-size="26">How Meeting Noter turns sound into transcript</text>
  <text x="40" y="78" class="meta" font-size="14">Two independent streams · fully on-device · ~real time</text>

  <!-- recording dot -->
  <g transform="translate(1108,44)">
    <circle r="8" fill="#a23b2e">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="5" class="meta" font-size="13" fill="#a23b2e">REC</text>
  </g>

  <!-- ============ connector spine ============ -->
  <path id="spine" d="M 250 210 H 970" fill="none" stroke="#d7c8b0" stroke-width="2" stroke-dasharray="2 6"/>

  <!-- flowing packets: two, offset in time, travelling the whole spine -->
  <circle r="6" fill="url(#accent)">
    <animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#spine"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.5;0.95;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="url(#accent)">
    <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#spine"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.5;0.95;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ============ STAGE 1 — Capture (dual waveform) ============ -->
  <g transform="translate(40,150)">
    <rect class="card" width="210" height="120" rx="14" filter="url(#soft)"/>
    <text x="18" y="30" class="lbl">1 · Capture</text>
    <text x="18" y="48" class="meta">mic + speaker · 48 kHz</text>
    <!-- mic waveform -->
    <g transform="translate(24,88)" fill="#b5552f">
      <rect x="0"   width="6" height="10" y="-5" rx="3"><animate attributeName="height" values="8;34;8"  dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="-4;-17;-4" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="12"  width="6" height="22" y="-11" rx="3"><animate attributeName="height" values="26;10;26" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="-13;-5;-13" dur="0.8s" repeatCount="indefinite"/></rect>
      <rect x="24"  width="6" height="30" y="-15" rx="3"><animate attributeName="height" values="14;38;14" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-7;-19;-7" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="36"  width="6" height="16" y="-8" rx="3"><animate attributeName="height" values="30;12;30" dur="0.7s" repeatCount="indefinite"/><animate attributeName="y" values="-15;-6;-15" dur="0.7s" repeatCount="indefinite"/></rect>
      <rect x="48"  width="6" height="24" y="-12" rx="3"><animate attributeName="height" values="10;28;10" dur="1s"   repeatCount="indefinite"/><animate attributeName="y" values="-5;-14;-5" dur="1s" repeatCount="indefinite"/></rect>
    </g>
    <!-- speaker waveform -->
    <g transform="translate(120,88)" fill="#d08a4f">
      <rect x="0"   width="6" height="18" y="-9" rx="3"><animate attributeName="height" values="12;30;12" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y" values="-6;-15;-6" dur="0.85s" repeatCount="indefinite"/></rect>
      <rect x="12"  width="6" height="28" y="-14" rx="3"><animate attributeName="height" values="30;10;30" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="-15;-5;-15" dur="1.05s" repeatCount="indefinite"/></rect>
      <rect x="24"  width="6" height="14" y="-7" rx="3"><animate attributeName="height" values="8;32;8" dur="0.75s" repeatCount="indefinite"/><animate attributeName="y" values="-4;-16;-4" dur="0.75s" repeatCount="indefinite"/></rect>
      <rect x="36"  width="6" height="22" y="-11" rx="3"><animate attributeName="height" values="26;12;26" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="-13;-6;-13" dur="0.95s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- ============ STAGE 2 — Resample ============ -->
  <g transform="translate(300,150)">
    <rect class="card" width="150" height="120" rx="14" filter="url(#soft)"/>
    <text x="16" y="30" class="lbl">2 · Resample</text>
    <text x="16" y="48" class="meta">FIR anti-alias</text>
    <text x="16" y="92" font-size="22" font-weight="700" fill="#3a3128">48 <tspan fill="#b5552f">→</tspan> 16<tspan font-size="14" fill="#9b8e78"> kHz</tspan></text>
    <circle cx="128" cy="86" r="4" fill="#b5552f"><animate attributeName="r" values="3;7;3" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ============ STAGE 3 — VAD ============ -->
  <g transform="translate(500,150)">
    <rect class="card" width="150" height="120" rx="14" filter="url(#soft)"/>
    <text x="16" y="30" class="lbl">3 · VAD</text>
    <text x="16" y="48" class="meta">voice probability</text>
    <!-- meter track -->
    <rect x="16" y="62" width="118" height="42" rx="8" fill="#efe5d6"/>
    <!-- enter/exit threshold guides -->
    <line x1="16" y1="72" x2="134" y2="72" stroke="#a23b2e" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <!-- fill -->
    <rect x="16" y="62" width="118" height="42" rx="8" fill="url(#accent)" opacity="0.85">
      <animate attributeName="width" values="10;118;40;118;10" keyTimes="0;0.3;0.5;0.75;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="16" y="52" class="meta" text-anchor="start"></text>
  </g>

  <!-- ============ STAGE 4 — Segmenter ============ -->
  <g transform="translate(700,150)">
    <rect class="card" width="160" height="120" rx="14" filter="url(#soft)"/>
    <text x="16" y="30" class="lbl">4 · Segmenter</text>
    <text x="16" y="48" class="meta">Partial · Segment · Sentence</text>
    <!-- buffer filling then flushing -->
    <rect x="16" y="66" width="128" height="20" rx="6" fill="#efe5d6"/>
    <rect x="16" y="66" height="20" rx="6" fill="#6f7a4d">
      <animate attributeName="width" values="0;128;0;90;0" keyTimes="0;0.45;0.5;0.9;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="16" y="104" class="ink">buffer → flush on silence</text>
  </g>

  <!-- ============ STAGE 5 — ASR ============ -->
  <g transform="translate(910,150)">
    <rect class="card" width="150" height="120" rx="14" filter="url(#soft)"/>
    <text x="16" y="30" class="lbl">5 · ASR</text>
    <text x="16" y="48" class="meta">Parakeet · CoreML</text>
    <g transform="translate(75,86)">
      <circle r="26" fill="none" stroke="#efe5d6" stroke-width="6"/>
      <circle r="26" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="120 163" transform="rotate(-90)">
        <animateTransform attributeName="transform" type="rotate" from="-90" to="270" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ============ Transcript panel ============ -->
  <g transform="translate(40,320)">
    <rect class="card" width="1020" height="104" rx="16" filter="url(#soft)"/>
    <circle cx="30" cy="34" r="12" fill="#b5552f" opacity="0.9"/>
    <text x="52" y="30" class="lbl">Live transcript</text>
    <text x="52" y="48" class="meta">words commit as you speak; silence ends the sentence</text>

    <g font-size="18" fill="#3a3128" font-weight="600">
      <text x="52" y="84" opacity="0">Let's<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.56;0.95;1" dur="3s" repeatCount="indefinite"/></text>
      <text x="112" y="84" opacity="0">review<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.64;0.95;1" dur="3s" repeatCount="indefinite"/></text>
      <text x="196" y="84" opacity="0">the<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.72;0.95;1" dur="3s" repeatCount="indefinite"/></text>
      <text x="238" y="84" opacity="0">quarterly<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.80;0.95;1" dur="3s" repeatCount="indefinite"/></text>
      <text x="346" y="84" opacity="0">numbers<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.82;0.88;0.95;1" dur="3s" repeatCount="indefinite"/></text>
      <!-- caret -->
      <rect x="452" y="70" width="3" height="20" fill="#b5552f"><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
