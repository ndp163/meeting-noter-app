name: release

# Tag-triggered signed release. Push a tag like `v0.1.1` to build the macOS
# bundle, sign it for the updater, generate latest.json, and publish a GitHub
# Release. The updater endpoint in tauri.conf.json points at this release's
# latest.json.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "noter ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # arm64 only — libFluidAudioBridge.dylib (CoreML) has no x86_64 slice,
          # so a universal build can't link the Intel half. App is Apple Silicon only.
          args: --target aarch64-apple-darwin
