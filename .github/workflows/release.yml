name: release

# One-click release. Go to Actions → release → Run workflow, pick the bump
# (patch/minor/major). The job bumps the version in package.json + tauri.conf.json,
# commits + tags it, builds and signs the macOS bundle, then publishes the signed
# bundle + latest.json to the PUBLIC repo `meeting-tool/meeting-noter-release` (the
# app repo is private, so the updater fetches the manifest from there).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install

      # Bump version in both files, commit + tag, push back to this repo.
      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          VERSION=$(npm version "${{ github.event.inputs.bump }}" --no-git-tag-version)
          VERSION="${VERSION#v}"
          node -e "const f='src-tauri/tauri.conf.json',j=require('./'+f);j.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD --tags

      # Build + sign only — no release in this private repo.
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # arm64 only — libFluidAudioBridge.dylib (CoreML) has no x86_64 slice,
          # so a universal build can't link the Intel half. App is Apple Silicon only.
          args: --target aarch64-apple-darwin

      # Build latest.json pointing at the public repo, then publish there.
      - name: Publish to releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
          RELEASES_REPO: meeting-tool/meeting-noter-release
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          TARBALL=$(ls "$BUNDLE_DIR"/*.app.tar.gz)
          SIG=$(ls "$BUNDLE_DIR"/*.app.tar.gz.sig)
          TARBALL_NAME=$(basename "$TARBALL")

          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "See release $TAG",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$(cat "$SIG")",
                "url": "https://github.com/$RELEASES_REPO/releases/download/$TAG/$TARBALL_NAME"
              }
            }
          }
          EOF

          gh release create "$TAG" \
            --repo "$RELEASES_REPO" \
            --title "noter $TAG" \
            "$TARBALL" "$SIG" latest.json
