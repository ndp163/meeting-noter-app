name: release

# One-click release. Go to Actions → release → Run workflow, pick the bump
# (patch/minor/major). The job bumps the version in package.json + tauri.conf.json,
# commits + tags it, builds and signs the macOS bundle, then publishes the signed
# bundle + latest.json to the PUBLIC repo `ndp163/meeting-noter-releases` (the
# app repo is private, so the updater fetches the manifest from there).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      notes:
        description: "Release notes (markdown). Leave empty to auto-generate from git log."
        type: string
        required: false
        default: ""

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        # Full history + tags. Default fetch-depth:1 is shallow: no prior tags
        # (so the notes range falls back to the whole log) and merge commits get
        # grafted to zero parents, defeating `git log --no-merges` — which leaked
        # "Merge pull request #N …" lines into the auto-generated release notes.
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install

      # Bump version in both files, commit + tag, push back to this repo.
      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          VERSION=$(npm version "${{ github.event.inputs.bump }}" --no-git-tag-version)
          VERSION="${VERSION#v}"
          node -e "const f='src-tauri/tauri.conf.json',j=require('./'+f);j.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD --tags

      # Build + sign only — no release in this private repo.
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # arm64 only — libFluidAudioBridge.dylib (CoreML) has no x86_64 slice,
          # so a universal build can't link the Intel half. App is Apple Silicon only.
          args: --target aarch64-apple-darwin

      # Build latest.json pointing at the public repo, then publish there.
      - name: Publish to releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
          RELEASES_REPO: ndp163/meeting-noter-releases
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          TARBALL=$(ls "$BUNDLE_DIR"/*.app.tar.gz)
          SIG=$(ls "$BUNDLE_DIR"/*.app.tar.gz.sig)

          # productName is "Meeting Noter" (has a space). GitHub rewrites spaces
          # to dots in asset names on upload, so a URL built from the local
          # (spaced) filename 404s and the updater silently fails to download.
          # Rename the assets to a space-free name and use it for both the upload
          # and the URL so they always match. Signature is verified over file
          # bytes (inline in latest.json), so renaming is safe.
          ASSET_NAME="$(basename "$TARBALL" | tr ' ' '.')"
          if [ "$(basename "$TARBALL")" != "$ASSET_NAME" ]; then
            mv "$TARBALL" "$BUNDLE_DIR/$ASSET_NAME"
            mv "$SIG" "$BUNDLE_DIR/$ASSET_NAME.sig"
            TARBALL="$BUNDLE_DIR/$ASSET_NAME"
            SIG="$BUNDLE_DIR/$ASSET_NAME.sig"
          fi
          URL="https://github.com/$RELEASES_REPO/releases/download/$TAG/$ASSET_NAME"

          # Notes: manual input wins; otherwise the conventional-commit subjects
          # since the previous tag (dropping chore:/ci: housekeeping).
          NOTES="${{ github.event.inputs.notes }}"
          if [ -z "$NOTES" ]; then
            PREV=$(git tag --sort=-v:refname | sed -n 2p)
            RANGE="$TAG"
            [ -n "$PREV" ] && RANGE="$PREV..$TAG"
            NOTES=$(git log "$RANGE" --no-merges --pretty='- %s' | grep -vE '^- (chore|ci):' || true)
          fi
          [ -z "$NOTES" ] && NOTES="Maintenance release."

          # jq builds JSON safely — escapes quotes/newlines in multi-line notes
          # that a heredoc would corrupt.
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$SIG")" \
            --arg url "$URL" \
            '{version:$version, notes:$notes, pub_date:$pub_date,
              platforms:{"darwin-aarch64":{signature:$sig, url:$url}}}' > latest.json

          gh release create "$TAG" \
            --repo "$RELEASES_REPO" \
            --title "noter $TAG" \
            --notes "$NOTES" \
            "$TARBALL" "$SIG" latest.json
